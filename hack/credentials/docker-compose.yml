# Emulator path: budtmo/docker-android (x86_64). NOTE: the CatGenie app is
# arm64-only, so this path needs ARM translation that Android 13 x86_64 images
# don't reliably provide — it may fail at app launch. Prefer the ReDroid path
# (docker-compose.redroid.yml + `make REDROID=1 ...`) for this app.
#
#   make up        # start the Android emulator (view at http://localhost:6080)
#   make install   # install the split APK set from ./apk
#   make frida     # push + start frida-server
#   make secret    # capture the HMAC key / 84-char secret
#   make token     # capture the JWT / refresh token
#
# Requirements on the host: Docker + KVM (/dev/kvm).

services:
  emulator:
    image: budtmo/docker-android:emulator_13.0
    container_name: catgenie-emulator
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - "6080:6080"   # noVNC web UI
      - "5555:5555"   # adb
    environment:
      EMULATOR_DEVICE: "Samsung Galaxy S10"
      WEB_VNC: "true"
      EMULATOR_ARGS: "-no-snapshot-save -writable-system"
    healthcheck:
      test: ["CMD", "bash", "-lc", "adb devices | grep -q emulator"]
      interval: 10s
      timeout: 5s
      retries: 30

  tools:
    build:
      context: .
      dockerfile: Dockerfile.tools
    container_name: catgenie-tools
    depends_on:
      - emulator
    environment:
      # adb daemon of the emulator container
      EMULATOR_HOST: "emulator"
      # App package name. Discover with:  make packages
      PKG: "com.petnovations"
      # docker-android emulators are x86_64
      FRIDA_ARCH: "x86_64"
    volumes:
      - ./frida:/work/frida:ro
      - ./out:/work/out
      - ./apk:/work/apk:ro
    working_dir: /work
    # Keep alive so `docker compose exec` / `run` is fast.
    command: ["sleep", "infinity"]
    tty: true
