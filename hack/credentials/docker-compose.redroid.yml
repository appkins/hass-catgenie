# ReDroid path: containerized Android on the host kernel, with bundled
# libndk_translation so the arm64-only CatGenie app runs on this x86_64 box.
#
# Run host prep first (loads binder):  sudo ./redroid-prep.sh
# Then drive it via the Makefile:      make REDROID=1 up install frida secret
#
# View/operate the screen from the host with scrcpy:
#   scrcpy --tcpip=127.0.0.1:5555     (or: adb connect localhost:5555 && scrcpy)

services:
  redroid:
    image: redroid/redroid:13.0.0_64only-latest
    container_name: catgenie-redroid
    privileged: true
    ports:
      - "5555:5555"   # adb
    volumes:
      - ./redroid-data:/data
    command:
      - androidboot.use_memfd=true          # modern kernels have no ashmem
      - androidboot.redroid_gpu_mode=guest  # software rendering (headless-safe)
      - ro.secure=0                          # root adb shell -> frida-server can run

  tools:
    build:
      context: .
      dockerfile: Dockerfile.tools
    container_name: catgenie-tools
    depends_on:
      - redroid
    environment:
      EMULATOR_HOST: "redroid"
      PKG: "com.petnovations"
      # ReDroid's Android OS is x86_64 (apps run arm under translation), so
      # frida-server must be x86_64. Our hooks are Java-layer, so translation
      # of the app's native libs doesn't matter.
      FRIDA_ARCH: "x86_64"
    volumes:
      - ./frida:/work/frida:ro
      - ./out:/work/out
      - ./apk:/work/apk:ro
    working_dir: /work
    command: ["sleep", "infinity"]
    tty: true
