name: Tox PR CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Tox
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: 3.14
    - name: Install dependencies
      run: |
        python -m pip install --upgrade setuptools pip
        python -m pip install tox-gh-actions
    - name: Run tox
      run: tox -q -p auto
